# APM (Microsoft Agent Package Manager) producer manifest.
# Lets consumers install egg's skills with a single command:
#   apm install Ryu0118/Egg
# Skill sources live in skills/ (single source of truth, shared with the
# Claude Code plugin); .apm/skills/ contains symlinks to them.
# version tracks the CLI release version; release.yml bumps it automatically.
name: egg
version: 0.2.2
description: egg CLI usage guide and template authoring skills for AI agents.
author: Ryu0118
license: MIT
dependencies:
  apm: []
  mcp: []
includes:
  - .apm/skills/egg-template/
  - .apm/skills/egg-cli-guide/
scripts: {}
