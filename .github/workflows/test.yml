name: Test

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'E2ETestsPackage/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.swiftlint.yml'
      - '.swift-ast-lint.yml'
      - '.swiftformat'
      - 'nestfile.yaml'
      - 'scripts/nest.sh'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'E2ETestsPackage/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.swiftlint.yml'
      - '.swift-ast-lint.yml'
      - '.swiftformat'
      - 'nestfile.yaml'
      - 'scripts/nest.sh'
      - '.github/workflows/test.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: Lint
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap dev tools
        run: ./scripts/nest.sh bootstrap nestfile.yaml

      - name: SwiftFormat
        run: .nest/bin/swiftformat --lint --config .swiftformat .

      - name: SwiftLint
        run: make swiftlint

      - name: My Swift Linter
        run: make my-lint

  unit-tests:
    name: Unit Tests
    needs: swiftlint
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run EggKitTests
        run: swift test

  e2e-tests:
    name: E2E Tests
    needs: unit-tests
    runs-on: macos-26
    # A wedged runner or a hung E2E process otherwise blocks the run for the
    # 360-minute default; a clean build + full suite fits well inside 30.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run E2E Tests
        working-directory: E2ETestsPackage
        # Uses the auto-provisioned GITHUB_TOKEN (scoped to this repo, safe to
        # expose to fork PRs) rather than a personal PAT. The E2E install tests
        # clone the public Ryu0118/swift-egg-templates fixture repo, which any
        # token — or none — can read; the token just raises the API rate limit.
        run: swift test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
