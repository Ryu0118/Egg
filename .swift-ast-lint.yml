excluded_paths:
  - ".build/**"
  - ".swiftpm/**"
  - ".nest/**"
  - "E2ETestsPackage/.build/**"
  - "**/.build/**"
  - "**/.swiftpm/**"
  - "**/Generated/**"

rules:
  deep-nesting:
    args:
      warning_depth: 3
      error_depth: 5
    include:
      - "Sources/EggKit/**"
  single-large-type-per-file:
    args:
      warning_lines: 80
      error_lines: 160
    include:
      - "Sources/EggKit/**"
    exclude:
      - "**/*Generated.swift"

  # Start documentation enforcement from the workflow staging surface.
  # Expanding this across all EggKit at once turns normal legacy cleanup into noise.
  # Keep project-wide structural rules above, and widen this include as files gain docs.
  missing-docs:
    args:
      ignore_patterns:
        - kinds: [init]
        - kinds: [enum]
          names: [CodingKeys]
        - kinds: [var]
          names: [errorDescription]
        - kinds: [func]
          names: ["=="]
    include:
      - "Sources/EggKit/WorkflowRunner/Staging/**"
    exclude:
      - "**/*Generated.swift"
